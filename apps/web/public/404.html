<!doctype html>
<html><head><meta charset="utf-8"><title>ForgeGuard AI</title><script>
  const pathSegmentsToKeep = 1;
  const locationValue = window.location;
  locationValue.replace(locationValue.protocol + '//' + locationValue.hostname + (locationValue.port ? ':' + locationValue.port : '') + locationValue.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' + locationValue.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') + (locationValue.search ? '&' + locationValue.search.slice(1).replace(/&/g, '~and~') : '') + locationValue.hash);
</script></head><body></body></html>
