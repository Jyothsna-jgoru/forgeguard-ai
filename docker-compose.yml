name: forgeguard

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forgeguard}
      POSTGRES_USER: ${POSTGRES_USER:-forgeguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgeguard_local}
    volumes:
      - forgeguard-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [forgeguard]

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-forgeguard}:${POSTGRES_PASSWORD:-forgeguard_local}@db:5432/${POSTGRES_DB:-forgeguard}
      FORGEGUARD_DEMO_MODE: "true"
      FORGEGUARD_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks: [forgeguard]

  web:
    build:
      context: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    networks: [forgeguard]

volumes:
  forgeguard-db:

networks:
  forgeguard:
    driver: bridge

